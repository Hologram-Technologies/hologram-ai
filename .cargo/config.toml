# Workspace-level Cargo configuration.

[net]
# Fetch git deps via the `git` CLI rather than libgit2 (uses git's credential
# helper, which has the access private UOR/Hologram repos need).
git-fetch-with-cli = true

# wasm32 builds target browsers that ship SIMD128.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
