name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt / clippy / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Upstream patches are consumed by path until their PRs merge; CI
      # materializes the sibling worktrees at the pinned revisions.
      - name: Check out hologram (feature/inference-model-layer base)
        uses: actions/checkout@v4
        with:
          repository: Hologram-Technologies/hologram
          ref: 94ecb886811115491a77c8229e494965bea03fc2
          path: hologram-im
      - name: Check out uor-r4 (feature/typed-integration-facade base)
        uses: actions/checkout@v4
        with:
          repository: UOR-Foundation/uor-r4
          ref: f1b4859e65363eda9aa7dbeb0db467d93c8f4b02
          path: uor-r4-facade
      - name: Apply upstream patch branches
        run: |
          # The path deps expect ../hologram-im and ../uor-r4-facade relative
          # to this repo; move the checkouts into place and apply the
          # patch-ready diffs mirrored under docs/upstream/patches/.
          mv hologram-im ../hologram-im
          mv uor-r4-facade ../uor-r4-facade
          git -C ../hologram-im apply docs/upstream/patches/hologram-inference-model.patch 2>/dev/null || true
          git -C ../uor-r4-facade apply docs/upstream/patches/uor-r4-typed-facade.patch 2>/dev/null || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  portable-core:
    name: wasm32 portable core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p hologram-ai-core --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p hologram-ai-bundle --no-default-features --target wasm32-unknown-unknown

  dependency-audit:
    name: no tensor / GPU / runtime-network deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - name: Forbidden dependency audit
        run: |
          set -e
          TREE="$(cargo tree --workspace --all-features 2>/dev/null || true)"
          for pat in onnxruntime ort candle tch-src torch cuda cudarc metal wgpu rocm opencl; do
            if printf '%s' "$TREE" | grep -qi "$pat"; then
              echo "forbidden dependency pattern in tree: $pat"; exit 1
            fi
          done
      - name: No public binary target
        run: |
          ! grep -RIn --include=Cargo.toml '^\[\[bin\]\]' crates/
      - name: No tless_store in bundles
        run: |
          ! grep -RIn 'tless_store' crates/ --include='*.rs' | grep -v 'never\|excluded\|EXCLUDED'
