[workspace]
resolver = "2"
members = [
    "crates/hologram-ai-core",
    "crates/hologram-ai-bundle",
    "crates/hologram-ai-r4",
    "crates/hologram-ai-huggingface",
    "crates/hologram-ai",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/Hologram-Technologies/hologram-ai"

[workspace.dependencies]
# ── Internal ────────────────────────────────────────────────────────────────
hologram-ai-core       = { path = "crates/hologram-ai-core", default-features = false }
hologram-ai-bundle     = { path = "crates/hologram-ai-bundle", default-features = false }
hologram-ai-r4         = { path = "crates/hologram-ai-r4" }
hologram-ai-huggingface = { path = "crates/hologram-ai-huggingface" }

# ── hologram (`.holo` container + layer model) ─────────────────────────────
# Pinned base: Hologram-Technologies/hologram @ 94ecb886811115491a77c8229e494965bea03fc2
# plus the PR-ready branch `feature/inference-model-layer` (.holo v4 +
# LayerKind::InferenceModel). Path deps until that PR merges upstream; then
# replace with: { git = "https://github.com/Hologram-Technologies/hologram.git", rev = "<merge-sha>" }.
# See docs/upstream/hologram-contract.md.
hologram-archive = { path = "../hologram-im/crates/hologram-archive" }
hologram-space   = { path = "../hologram-im/crates/hologram-space" }

# ── uor-r4 (compiler + R4G1 runtime) ────────────────────────────────────────
# Pinned base: UOR-Foundation/uor-r4 @ f1b4859e65363eda9aa7dbeb0db467d93c8f4b02
# plus the PR-ready branch `feature/typed-integration-facade` (crate uor-r4-api).
# Path dep until that PR merges upstream; then replace with:
# { git = "https://github.com/UOR-Foundation/uor-r4.git", rev = "<merge-sha>" }.
# See docs/upstream/uor-r4-contract.md. Wired in Phase 4 (hologram-ai-r4).
#uor-r4-api = { path = "../uor-r4-facade/crates/uor-r4-api" }

# ── Third-party ─────────────────────────────────────────────────────────────
blake3 = "1"
